name: Daily 2A Pulse archive

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC every day = 09:30 Malaysia time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: pulse-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compute and append yesterday's score
        run: node scripts/pulse.mjs
      - name: Save to the archive
        run: |
          git config user.name  "2A Pulse bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No new day to save."; exit 0; fi
          git commit -m "Archive 2A Pulse for $(date -u -d 'yesterday' +%F)"
          git push
